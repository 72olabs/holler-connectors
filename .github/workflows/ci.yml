name: Connector CI
# validate.py and the unit tests are pure Python, so Linux is enough. No rerun
# on push to main: the strict required check already tests the up-to-date tree.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    # The name is a required status check on main.
    name: packages (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
